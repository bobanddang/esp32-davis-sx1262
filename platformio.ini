; ESP32 + Waveshare Core1262-HF (SX1262) Davis Vantage receiver
; Publishes decoded ISS telemetry to Home Assistant via MQTT Auto-Discovery
;
; Credentials live in gitignored secrets.ini (see secrets.ini.example).
; IMPORTANT: secrets.ini replaces env build_flags — include ${flags*} there.

[platformio]
extra_configs = secrets.ini

[flags]
build_flags =
    -D CORE_DEBUG_LEVEL=0

; Native USB Serial/JTAG boards (most C3/C5 USB-C modules) need CDC or Serial is silent.
[flags_usb]
build_flags =
    ${flags.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    jgromes/RadioLib@^6.6.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    ${flags.build_flags}

; ESP32-C3 (DevKit / SuperMini / similar with native USB-C)
[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    ${env:esp32-s3-devkitc1-n16r8.lib_deps}
board_build.cdc_on_boot = 1
build_flags =
    ${flags_usb.build_flags}

; Waveshare ESP32-C5-Zero (4MB flash) — same radio pin map as C3
[env:esp32-c5-devkitc1-n4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc1-n4
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    ${env:esp32-s3-devkitc1-n16r8.lib_deps}
board_build.cdc_on_boot = 1
build_flags =
    ${flags_usb.build_flags}
